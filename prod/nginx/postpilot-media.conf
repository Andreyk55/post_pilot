# ────────────────────────────────────────────────────────────────────────────
# PostPilot — host nginx config for https://media.publishharbor.com
# (temporarily also serving the legacy https://media.post-pilot.cloud-ip.cc
# hostname during the domain migration — do not remove the old name until
# it's confirmed no clients still depend on it)
#
# Reverse-proxies the public HTTPS hostname(s) to the MinIO container bound
# to 127.0.0.1:9000 by prod/docker-compose.yml. S3 signature v4 binds the
# presigned URL to the exact host MinIO sees, so MINIO_SERVER_URL in
# docker-compose.yml must match whichever hostname a given presigned URL
# was minted for.
#
# Install on the VPS as:
#   /etc/nginx/sites-available/postpilot-media.conf
#   /etc/nginx/sites-enabled/postpilot-media.conf  (symlink)
#
# Cert (one-time, when a cert already exists for the old domain — expand it
# to cover both names so a single HTTPS server block can serve both):
#   sudo certbot --nginx \
#     --cert-name media.post-pilot.cloud-ip.cc \
#     --expand \
#     -d media.post-pilot.cloud-ip.cc \
#     -d media.publishharbor.com
#
# Then:
#   sudo nginx -t && sudo systemctl reload nginx
# ────────────────────────────────────────────────────────────────────────────

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name media.publishharbor.com media.post-pilot.cloud-ip.cc;

    # ACME http-01 challenge (Certbot writes here during renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS termination + reverse proxy to the MinIO container (127.0.0.1:9000)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.publishharbor.com media.post-pilot.cloud-ip.cc;

    # Certbot --expand keeps certs under the original --cert-name directory
    # (media.post-pilot.cloud-ip.cc) even after adding media.publishharbor.com
    # as a SAN. If certbot ever creates a differently-named lineage instead,
    # update these two paths to match `sudo certbot certificates` output.
    ssl_certificate     /etc/letsencrypt/live/media.post-pilot.cloud-ip.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.post-pilot.cloud-ip.cc/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Transport cap, NOT a product rule. The largest per-placement media limit is
    # 200MB (Facebook Story video, MediaValidationRules); keep this cap ABOVE that
    # so a maximum-size upload (plus request headers) is never cut off at the proxy.
    # Note: Supabase-storage deployments upload directly to Supabase and never pass
    # through this proxy — Supabase Free's global 50MB cap is enforced there instead.
    client_max_body_size 320m;

    # Stream the upload body straight to MinIO instead of buffering the
    # whole file to nginx's disk. Required for large videos and for
    # progress reporting on the browser side to be meaningful.
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_http_version      1.1;

    # MinIO does long uploads — bump from nginx's defaults so a slow
    # client doesn't trip a timeout mid-upload.
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    proxy_connect_timeout   10s;

    # MinIO has its own CORS handling driven by MINIO_API_CORS_ALLOW_ORIGIN
    # in docker-compose.yml — don't add nginx-level CORS headers here or
    # they'll be duplicated on the response and break the browser preflight.

    location / {
        proxy_pass http://127.0.0.1:9000;

        # Preserve the host MinIO signed against. Presigned URLs are only
        # valid for the exact host they were minted for (MINIO_SERVER_URL) —
        # a URL signed for media.post-pilot.cloud-ip.cc will fail with
        # SignatureDoesNotMatch if fetched via media.publishharbor.com, and
        # vice versa. Both hostnames are accepted here so in-flight URLs
        # signed under either name keep working during the migration.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

